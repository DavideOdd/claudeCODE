<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Tracking Stickman</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pose Tracking Stickman</h1>

        <div class="controls">
            <button id="startBtn">Avvia Fotocamera</button>
            <button id="stopBtn" disabled>Ferma Fotocamera</button>
        </div>

        <div class="content">
            <div class="video-container">
                <h2>Fotocamera</h2>
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output" class="output-canvas"></canvas>
            </div>

            <div class="svg-container">
                <h2>Stickman SVG</h2>
                <svg id="stickman" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle id="head" cx="320" cy="100" r="30" fill="none" stroke="#00ff00" stroke-width="3"/>

                    <!-- Body -->
                    <line id="spine" x1="320" y1="130" x2="320" y2="280" stroke="#00ff00" stroke-width="3"/>

                    <!-- Left Arm -->
                    <line id="leftShoulder" x1="320" y1="150" x2="250" y2="150" stroke="#00ff00" stroke-width="3"/>
                    <line id="leftUpperArm" x1="250" y1="150" x2="220" y2="200" stroke="#00ff00" stroke-width="3"/>
                    <line id="leftLowerArm" x1="220" y1="200" x2="200" y2="250" stroke="#00ff00" stroke-width="3"/>

                    <!-- Right Arm -->
                    <line id="rightShoulder" x1="320" y1="150" x2="390" y2="150" stroke="#00ff00" stroke-width="3"/>
                    <line id="rightUpperArm" x1="390" y1="150" x2="420" y2="200" stroke="#00ff00" stroke-width="3"/>
                    <line id="rightLowerArm" x1="420" y1="200" x2="440" y2="250" stroke="#00ff00" stroke-width="3"/>

                    <!-- Left Leg -->
                    <line id="leftUpperLeg" x1="320" y1="280" x2="290" y2="360" stroke="#00ff00" stroke-width="3"/>
                    <line id="leftLowerLeg" x1="290" y1="360" x2="280" y2="450" stroke="#00ff00" stroke-width="3"/>

                    <!-- Right Leg -->
                    <line id="rightUpperLeg" x1="320" y1="280" x2="350" y2="360" stroke="#00ff00" stroke-width="3"/>
                    <line id="rightLowerLeg" x1="350" y1="360" x2="360" y2="450" stroke="#00ff00" stroke-width="3"/>

                    <!-- Joints -->
                    <circle id="leftShouderJoint" cx="250" cy="150" r="5" fill="#ff0000"/>
                    <circle id="rightShoulderJoint" cx="390" cy="150" r="5" fill="#ff0000"/>
                    <circle id="leftElbowJoint" cx="220" cy="200" r="5" fill="#ff0000"/>
                    <circle id="rightElbowJoint" cx="420" cy="200" r="5" fill="#ff0000"/>
                    <circle id="leftWristJoint" cx="200" cy="250" r="5" fill="#ff0000"/>
                    <circle id="rightWristJoint" cx="440" cy="250" r="5" fill="#ff0000"/>
                    <circle id="leftHipJoint" cx="290" cy="280" r="5" fill="#ff0000"/>
                    <circle id="rightHipJoint" cx="350" cy="280" r="5" fill="#ff0000"/>
                    <circle id="leftKneeJoint" cx="290" cy="360" r="5" fill="#ff0000"/>
                    <circle id="rightKneeJoint" cx="350" cy="360" r="5" fill="#ff0000"/>
                    <circle id="leftAnkleJoint" cx="280" cy="450" r="5" fill="#ff0000"/>
                    <circle id="rightAnkleJoint" cx="360" cy="450" r="5" fill="#ff0000"/>
                </svg>
                <div id="status" class="status">In attesa...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>

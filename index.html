<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Tracking Stickman</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pose Tracking Stickman</h1>

        <div class="controls">
            <div class="control-row">
                <button id="startBtn">Avvia Fotocamera</button>
                <button id="stopBtn" disabled>Ferma Fotocamera</button>
                <button id="switchCameraBtn" disabled>Cambia Camera</button>
            </div>

            <div class="control-row">
                <label class="toggle-container">
                    <input type="checkbox" id="handsToggle" disabled>
                    <span class="toggle-label">Tracking Mani</span>
                </label>
            </div>

            <div class="control-row">
                <button id="snapshotBtn" disabled>📷 Foto Stickman</button>
                <button id="startRecordBtn" disabled>🔴 Avvia Registrazione</button>
                <button id="stopRecordBtn" disabled style="display: none;">⏹️ Ferma Registrazione</button>
            </div>
        </div>

        <div class="content">
            <div class="video-container">
                <h2>Fotocamera</h2>
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output" class="output-canvas"></canvas>
            </div>

            <div class="svg-container">
                <h2>Stickman SVG</h2>
                <svg id="stickman" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle id="head" cx="320" cy="100" r="30" fill="none" stroke="#000000" stroke-width="6"/>

                    <!-- Face Features -->
                    <circle id="leftEye" cx="310" cy="95" r="3" fill="#000000"/>
                    <circle id="rightEye" cx="330" cy="95" r="3" fill="#000000"/>
                    <path id="mouth" d="M 310 110 Q 320 115 330 110" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

                    <!-- Body -->
                    <line id="spine" x1="320" y1="130" x2="320" y2="280" stroke="#000000" stroke-width="6"/>

                    <!-- Left Arm -->
                    <line id="leftShoulder" x1="320" y1="150" x2="250" y2="150" stroke="#000000" stroke-width="6"/>
                    <line id="leftUpperArm" x1="250" y1="150" x2="220" y2="200" stroke="#000000" stroke-width="6"/>
                    <line id="leftLowerArm" x1="220" y1="200" x2="200" y2="250" stroke="#000000" stroke-width="6"/>

                    <!-- Right Arm -->
                    <line id="rightShoulder" x1="320" y1="150" x2="390" y2="150" stroke="#000000" stroke-width="6"/>
                    <line id="rightUpperArm" x1="390" y1="150" x2="420" y2="200" stroke="#000000" stroke-width="6"/>
                    <line id="rightLowerArm" x1="420" y1="200" x2="440" y2="250" stroke="#000000" stroke-width="6"/>

                    <!-- Left Leg -->
                    <line id="leftUpperLeg" x1="320" y1="280" x2="290" y2="360" stroke="#000000" stroke-width="6"/>
                    <line id="leftLowerLeg" x1="290" y1="360" x2="280" y2="450" stroke="#000000" stroke-width="6"/>

                    <!-- Right Leg -->
                    <line id="rightUpperLeg" x1="320" y1="280" x2="350" y2="360" stroke="#000000" stroke-width="6"/>
                    <line id="rightLowerLeg" x1="350" y1="360" x2="360" y2="450" stroke="#000000" stroke-width="6"/>

                    <!-- Hands (visible when hand tracking is enabled) -->
                    <g id="leftHand" style="display: none;">
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                    </g>
                    <g id="rightHand" style="display: none;">
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                        <line class="finger" stroke="#000000" stroke-width="4"/>
                    </g>
                </svg>
                <div id="status" class="status">In attesa...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
